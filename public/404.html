<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting...</title>
    <script>
      // GitHub Pages SPA fallback
      // /easy-guide-pro/anything -> /easy-guide-pro/?/anything
      const path = window.location.pathname;
      const search = window.location.search || "";
      const hash = window.location.hash || "";
      const repoBase = "/easy-guide-pro/";
      const route = path.startsWith(repoBase) ? path.slice(repoBase.length) : "";
      const redirectTo = repoBase + (route ? "?/" + route : "") + search + hash;
      window.location.replace(redirectTo);
    </script>
  </head>
  <body></body>
</html>
